<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNA - Inversiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-yellow-400">LUNA</h1>
            <nav class="flex gap-4">
                <button onclick="scrollToId('planes')" class="hover:text-yellow-400">Planes</button>
                <button onclick="openAuthModal()" class="bg-yellow-500 text-black px-4 py-2 rounded font-bold hover:bg-yellow-400">Cuenta</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <section class="text-center py-10">
            <h2 class="text-4xl font-bold mb-4">Inversiones To The Moon 🚀</h2>
            <p class="text-gray-600">Plataforma segura de inversión y P2P.</p>
        </section>

        <section id="planes" class="mb-10">
            <h3 class="text-2xl font-bold mb-6">Nuestros Planes</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-lg shadow border-t-4 border-blue-500">
                    <h4 class="text-xl font-bold">Inicial</h4>
                    <p class="text-3xl font-bold my-2">1.0% <span class="text-sm font-normal">/día</span></p>
                    <button onclick="startInvest('Plan Inicial')" class="w-full bg-blue-600 text-white py-2 rounded mt-4">Elegir</button>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border-t-4 border-purple-500">
                    <h4 class="text-xl font-bold">Avanzado</h4>
                    <p class="text-3xl font-bold my-2">1.5% <span class="text-sm font-normal">/día</span></p>
                    <button onclick="startInvest('Plan Avanzado')" class="w-full bg-purple-600 text-white py-2 rounded mt-4">Elegir</button>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border-t-4 border-yellow-500">
                    <h4 class="text-xl font-bold">VIP</h4>
                    <p class="text-3xl font-bold my-2">2.0% <span class="text-sm font-normal">/día</span></p>
                    <button onclick="startInvest('Plan VIP')" class="w-full bg-yellow-600 text-white py-2 rounded mt-4">Elegir</button>
                </div>
            </div>
        </section>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4">Ingresar</h3>
            <input type="text" placeholder="Usuario" class="w-full border p-2 rounded mb-4">
            <button onclick="closeAuthModal()" class="w-full bg-red-500 text-white py-2 rounded">Cerrar</button>
        </div>
    </div>

    <script>
        // Funciones Globales
        
        // 1. Función para mover la pantalla
        window.scrollToId = function(id) {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.scrollIntoView({ behavior: 'smooth' });
            } else {
                console.error("No encontré el elemento: " + id);
            }
        };

        // 2. Función para abrir modal
        window.openAuthModal = function() {
            const modal = document.getElementById('auth-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        // 3. Función para cerrar modal
        window.closeAuthModal = function() {
            const modal = document.getElementById('auth-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        // 4. Función de Inversión
        window.startInvest = function(nombrePlan) {
            alert("Has seleccionado el: " + nombrePlan + "\n(Debes iniciar sesión primero)");
            window.openAuthModal();
        };

        // Mensaje de carga
        console.log("Sistema LUNA cargado correctamente v2.0");
    </script>
</body>
</html>
